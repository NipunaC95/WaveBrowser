appId: com.wavebrowse.app
productName: WaveBrowse
copyright: Copyright © 2026 Nipuna Chandimal

directories:
  output: releases
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - demo-samples/**/*
  - package.json

asar: true

mac:
  category: public.app-category.music
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  minimumSystemVersion: "10.15.0"
  identity: null

dmg:
  title: "${productName} ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: WaveBrowse
